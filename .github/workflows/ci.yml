name: ci

on:
  push:
    branches-ignore: [ci-release-prep]
  pull_request:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: contract/go.sum
      - name: repaired security invariants and release authentication
        working-directory: contract
        run: go test -p 2 -v -count=1 -timeout 15m -run 'Test(LateOccurrenceBulkBarrierIsDurableMetadataOnly|NativeCodexDefaultModesRequirePrivateContainment|RedactBeforeBoundaryAndActualGolden|QuarantineRecallClosureAllArrivalOrders|LocalUnseenErasureFencesHostedQuarantine|LocalErasureScrubsSidecarWithoutHostedRound|LocalScrubDoesNotDeadlockSidecarWriter|LocalScrubFencesStalePreparedExport|HostedServiceKeyRotationVerifiesNewReceipts|TransferredMetadataKeepsPolicyProvenance|RepositoryProofRequiresCurrentVerifiedIdentity|GovernedTaskBundleUsesSignedRepositoryProof|NodeLocalAdapterUsesSharedCorpus|NodeExportAdapterUsesEverySharedCorpusCase|AuthenticatedTarget|HostedEnrollment|Release)' ./record ./internal/node/capture ./internal/node/store ./internal/node/syncnode ./internal/node/localpolicy ./releaseauth ./cmd/telara-memory

  linux-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: contract/go.sum
      - name: trusted source and temporary directories
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp /ci-source
          cp -R contract /ci-source/contract
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: Linux native custody and current security invariants
        run: |
          cd /ci-source/contract
          go test -p 2 -v -count=1 -timeout 15m -run 'Test(LateOccurrenceBulkBarrierIsDurableMetadataOnly|NativeCodexDefaultModesRequirePrivateContainment|HostedEnrollment|HostedServiceKeyRotation|TransferredMetadataKeepsPolicyProvenance|RepositoryProof|TenantKeyOutsideLoginRefused|GovernedTaskBundle|LocalErasureScrubs|LocalScrub|SecretServiceProfileHoldsIndependentSecrets|SecretServiceInstalledAuthorityReassignmentBeforeAndAfterLoad|InstalledStuckClientHintDoesNotBlockOtherClient)' ./internal/node/capture ./internal/node/store ./internal/node/syncnode ./internal/node/vault ./cmd/telara-memory

  windows-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: contract/go.sum
      - name: native owner ACL and read-only diagnostics
        working-directory: contract
        shell: bash
        run: go test -p 2 -v -count=1 -timeout 15m -run 'Test(Windows|SQLiteURIUsesNativeAbsolutePath|DoctorMainStoreInspectionSidecars|DoctorSyncInspectionWritesNothing|ReleaseDirectory)' ./internal/node/store ./internal/node/ipc ./internal/node/doctor ./cmd/telara-memory

  native-client-driver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: contract/go.sum
      - name: isolated client authentication and environment checks
        working-directory: contract
        run: go test -p 2 -tags e2e -v -count=1 -run '^TestHarness(AuthIsolation|EnvironmentAndArguments|PrecompiledNativeHelper)$' ./e2e/clients
      - name: build native acceptance driver
        working-directory: contract
        run: go test -p 2 -tags e2e -c -o ../clients.test ./e2e/clients
      - name: build actual node CLI for native acceptance
        working-directory: contract
        run: go build -p 2 -trimpath -o ../telara-memory-darwin-arm64 ./cmd/telara-memory
      - name: compile native acceptance utility
        run: |
          ./clients.test export-native-helper-source "$PWD/native-helper.c"
          /usr/bin/clang -Wno-deprecated-declarations native-helper.c -framework Security -framework CoreFoundation -o keychain-helper
          shasum -a 256 keychain-helper > keychain-helper.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-client-driver
          path: |
            clients.test
            telara-memory-darwin-arm64
            keychain-helper
            keychain-helper.sha256
          retention-days: 3

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: contract/go.sum
      - name: private temp root
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # The installer refuses directories below the sticky, world-writable /tmp.
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-source
          cp -R contract /ci-source/contract
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: vet
        shell: bash
        run: |
          if [ "$(uname)" = Linux ]; then cd /ci-source/contract; fi
          go vet ./...
      - name: test
        shell: bash
        run: |
          if [ "$(uname)" = Linux ]; then cd /ci-source/contract; fi
          go test -p 2 -count=1 -timeout 60m ./...

  race:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: contract/go.sum
      - name: trusted source and temporary roots
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp /ci-source
          cp -R contract /ci-source/contract
          mkdir -p race-evidence
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: every package and store function under race detection
        run: |
          cd /ci-source/contract
          go list ./... > "$GITHUB_WORKSPACE/race-evidence/all-packages.list"
          awk -v part="${{ matrix.shard }}" '$0 !~ /internal\/node\/store$/ && (NR-1)%4==part-1' "$GITHUB_WORKSPACE/race-evidence/all-packages.list" > "$GITHUB_WORKSPACE/race-evidence/selected-packages.list"
          go test -list '^(Test|Fuzz|Example)' ./internal/node/store | awk '/^(Test|Fuzz|Example)[[:alnum:]_]*$/' > "$GITHUB_WORKSPACE/race-evidence/all-store-functions.list"
          test -s "$GITHUB_WORKSPACE/race-evidence/all-store-functions.list"
          awk -v part="${{ matrix.shard }}" '(NR-1)%4==part-1' "$GITHUB_WORKSPACE/race-evidence/all-store-functions.list" > "$GITHUB_WORKSPACE/race-evidence/selected-store-functions.list"
          test -s "$GITHUB_WORKSPACE/race-evidence/selected-store-functions.list"
          go test -race -p 1 -v -count=1 -timeout 25m -run "^($(paste -sd '|' "$GITHUB_WORKSPACE/race-evidence/selected-store-functions.list"))$" ./internal/node/store > "$GITHUB_WORKSPACE/race-evidence/store.log" 2>&1 || { cat "$GITHUB_WORKSPACE/race-evidence/store.log"; exit 1; }
          xargs -r go test -race -p 1 -count=1 -timeout 25m < "$GITHUB_WORKSPACE/race-evidence/selected-packages.list" > "$GITHUB_WORKSPACE/race-evidence/packages.log" 2>&1 || { cat "$GITHUB_WORKSPACE/race-evidence/packages.log"; exit 1; }
          cat "$GITHUB_WORKSPACE/race-evidence/packages.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-race-${{ matrix.shard }}
          path: race-evidence
          retention-days: 3
