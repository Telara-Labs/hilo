              expected_pure={puremod if item=="." else puremod+"/"+item[2:] for item in selected_pure}
              expected_node={nodemod if item=="." else nodemod+"/"+item[2:] for item in selected_node}
              for filename,expected,testpkgs in (("pure-packages.jsonl",expected_pure,set(pure_tests)),("runtime-packages.jsonl",expected_node,set(node_tests))):
                  events=read_json_events(logs[number][filename],number,filename)
                  if {e["Package"] for e in events}!={*expected}: fail(f"actual package event set differs from shard {number} {filename} selection")
                  audit_stream(events,expected,testpkgs,number,filename)
              if store not in set(node_tests): fail("store package is not recorded as test-bearing")
              store_events=read_json_events(logs[number]["store.jsonl"],number,"store.jsonl")
              selected_store=set(unique_lines(folder/"selected-store-functions.list"))
              expected_store_names=selected_store
              audit_stream(store_events,{store},{store},number,"store.jsonl",store)
              top_runs={test.split("/",1)[0] for pkg,test in Counter((e["Package"],e.get("Test","")) for e in store_events if e.get("Action")=="run") if pkg==store}
              if top_runs!=selected_store: fail(f"store selected top-level run set differs in shard {number}")
          report={"status":"PASS_WITH_EXPLICIT_NOT_RUN","source_commit":source_commit,"contract_tree":contract_tree,"source_manifest_sha256":hashlib.sha256(baselines["source-contract-files.json"]).hexdigest(),"skip_policy_sha256":policy_hash,"pure_packages":len(pure),"runtime_packages":len(node),"union_packages":len(union),"pure_test_packages":len(pure_tests),"runtime_test_packages":len(node_tests),"store_functions":len(functions),"package_shards":4,"store_function_shards":4,"not_run":sorted(not_run,key=lambda x:(x["package"],x["test"],x["shard"]))}
          Path("race-audit").mkdir()
          (Path("race-audit")/"aggregate-audit.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-race-union-audit
          path: race-audit/aggregate-audit.json
