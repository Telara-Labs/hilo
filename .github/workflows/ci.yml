name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: contract/go.sum
      - name: private temp root
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # The installer refuses directories below the sticky, world-writable /tmp.
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -p 2 -count=1 -timeout 60m ./...

  race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: contract/go.sum
      - name: private temp root
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # The installer refuses directories below the sticky, world-writable /tmp.
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: race
        run: go test -race -p 2 -count=1 -timeout 90m ./...
