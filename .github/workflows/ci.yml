name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: pure contract security invariants and release authentication
        working-directory: contract
        run: go test -mod=readonly -p 2 -v -count=1 -timeout 15m -run 'Test(RedactBeforeBoundaryAndActualGolden|AuthenticatedTarget|Release)' ./record ./releaseauth
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: runtime security invariants
        working-directory: contract/internal/node
        run: go test -mod=readonly -p 2 -v -count=1 -timeout 15m -run 'Test(PiCompositeCallIdentity|LateOccurrenceBulkBarrierIsDurableMetadataOnly|NativeCodexDefaultModesRequirePrivateContainment|QuarantineRecallClosureAllArrivalOrders|LocalUnseenErasureFencesHostedQuarantine|LocalErasureScrubsSidecarWithoutHostedRound|LocalScrubDoesNotDeadlockSidecarWriter|LocalScrubFencesStalePreparedExport|HostedServiceKeyRotationVerifiesNewReceipts|TransferredMetadataKeepsPolicyProvenance|RepositoryProofRequiresCurrentVerifiedIdentity|GovernedTaskBundleUsesSignedRepositoryProof|NodeLocalAdapterUsesSharedCorpus|NodeExportAdapterUsesEverySharedCorpusCase|HostedEnrollment|ReleaseDirectory)' ./capture ./store ./syncnode ./localpolicy ./cmd/hilo

  linux-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: trusted source and temporary directories
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp /ci-source
          cp -R contract /ci-source/contract
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: Linux native custody and current security invariants
        run: |
          cd /ci-source/contract/internal/node
          go test -mod=readonly -p 2 -v -count=1 -timeout 15m -run 'Test(PiCompositeCallIdentity|LateOccurrenceBulkBarrierIsDurableMetadataOnly|NativeCodexDefaultModesRequirePrivateContainment|HostedEnrollment|HostedServiceKeyRotation|TransferredMetadataKeepsPolicyProvenance|RepositoryProof|TenantKeyOutsideLoginRefused|GovernedTaskBundle|LocalErasureScrubs|LocalScrub|SecretServiceProfileHoldsIndependentSecrets|SecretServiceInstalledAuthorityReassignmentBeforeAndAfterLoad|InstalledStuckClientHintDoesNotBlockOtherClient)' ./capture ./store ./syncnode ./vault ./cmd/hilo

  windows-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: native owner ACL and read-only diagnostics
        working-directory: contract/internal/node
        shell: bash
        run: go test -mod=readonly -p 2 -v -count=1 -timeout 15m -run 'Test(Windows|SQLiteURIUsesNativeAbsolutePath|DoctorMainStoreInspectionSidecars|DoctorSyncInspectionWritesNothing|ReleaseDirectory)' ./store ./ipc ./doctor ./cmd/hilo

  native-client-driver:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: isolated client authentication and environment checks
        working-directory: contract/internal/node
        run: go test -mod=readonly -p 2 -tags e2e -v -count=1 -run '^TestHarness(AuthIsolation|EnvironmentAndArguments|PrecompiledNativeHelper)$' ./e2e/clients
      - name: build native acceptance driver
        working-directory: contract/internal/node
        run: go test -mod=readonly -p 2 -tags e2e -c -o "$GITHUB_WORKSPACE/clients.test" ./e2e/clients
      - name: build actual node CLI for native acceptance
        working-directory: contract/internal/node
        run: go build -mod=readonly -p 2 -trimpath -o "$GITHUB_WORKSPACE/hilo-darwin-arm64" ./cmd/hilo
      - name: compile native acceptance utility
        run: |
          ./clients.test export-native-helper-source "$PWD/native-helper.c"
          /usr/bin/clang -Wno-deprecated-declarations native-helper.c -framework Security -framework CoreFoundation -o keychain-helper
          shasum -a 256 keychain-helper > keychain-helper.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-client-driver
          path: |
            clients.test
            hilo-darwin-arm64
            keychain-helper
            keychain-helper.sha256
          retention-days: 3

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Python conformance requirements
        run: python -m pip install --disable-pip-version-check -r conformance/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: private temp root
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # The installer refuses directories below the sticky, world-writable /tmp.
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-source
          cp -R contract /ci-source/contract
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: pure contract vet
        shell: bash
        run: |
          if [ "$(uname)" = Linux ]; then cd /ci-source/contract; fi
          go vet -mod=readonly ./...
      - name: pure contract full unit suite
        shell: bash
        run: |
          if [ "$(uname)" = Linux ]; then cd /ci-source/contract; fi
          go test -mod=readonly -p 2 -count=1 -timeout 60m ./...
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: runtime vet
        shell: bash
        run: |
          if [ "$(uname)" = Linux ]; then cd /ci-source/contract/internal/node; else cd internal/node; fi
          go vet -mod=readonly ./...
      - name: runtime full unit suite
        shell: bash
        run: |
          if [ "$(uname)" = Linux ]; then cd /ci-source/contract/internal/node; else cd internal/node; fi
          go test -mod=readonly -p 2 -count=1 -timeout 60m ./...

  race:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Python conformance requirements
        run: python -m pip install --disable-pip-version-check -r contract/conformance/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: trusted source and temporary roots
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /ci-tmp /ci-source
          mkdir -p race-evidence
          git rev-parse HEAD > race-evidence/source-commit.txt
          git rev-parse HEAD:contract > race-evidence/contract-tree.txt
          git status --porcelain --untracked-files=all -- contract > race-evidence/source-status-before.txt
          test ! -s race-evidence/source-status-before.txt
          (cd contract && sha256sum go.mod go.sum internal/node/go.mod internal/node/go.sum) > race-evidence/source-module-files.sha256
          python3 - race-evidence/source-contract-files.json <<'PY'
          import hashlib,json,os,stat,subprocess,sys
          from pathlib import Path
          files={}
          tracked=subprocess.check_output(["git","ls-files","-z","--","contract"]).split(b"\0")
          for raw in tracked:
              if not raw: continue
              path=raw.decode("utf-8")
              if not path.startswith("contract/"): raise SystemExit(f"unexpected tracked path {path}")
              relative=path[len("contract/"):]
              info=os.lstat(path)
              if not stat.S_ISREG(info.st_mode): raise SystemExit(f"non-regular source file {path}")
              payload=Path(path).read_bytes()
              files[relative]={"sha256":hashlib.sha256(payload).hexdigest(),"mode":stat.S_IMODE(info.st_mode)}
          value={"schema":"hilo.contract-source.v1","source_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"contract_tree":subprocess.check_output(["git","rev-parse","HEAD:contract"],text=True).strip(),"files":files}
          Path(sys.argv[1]).write_text(json.dumps(value,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
          cat > race-evidence/verify-source-export.py <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          manifest_path,source_root=map(Path,sys.argv[1:])
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schema")!="hilo.contract-source.v1": raise SystemExit("unknown source manifest schema")
          expected=manifest.get("files")
          if not isinstance(expected,dict) or not expected: raise SystemExit("empty or invalid source manifest")
          actual={}
          for directory,dirs,names in os.walk(source_root,followlinks=False):
              for name in dirs:
                  if (Path(directory)/name).is_symlink(): raise SystemExit(f"symlink directory in source export: {Path(directory)/name}")
              for name in names:
                  path=Path(directory)/name
                  info=os.lstat(path)
                  if not stat.S_ISREG(info.st_mode): raise SystemExit(f"non-regular file in source export: {path}")
                  relative=path.relative_to(source_root).as_posix()
                  actual[relative]={"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"mode":stat.S_IMODE(info.st_mode)}
          if set(actual)!=set(expected): raise SystemExit(f"source export path set mismatch missing={sorted(set(expected)-set(actual))[:5]} extra={sorted(set(actual)-set(expected))[:5]}")
          if actual!=expected: raise SystemExit("source export bytes or modes differ from bound manifest")
          PY
          cp -R contract /ci-source/contract
          python3 race-evidence/verify-source-export.py race-evidence/source-contract-files.json /ci-source/contract
          (cd /ci-source/contract && sha256sum -c "$GITHUB_WORKSPACE/race-evidence/source-module-files.sha256")
          git rev-parse HEAD > race-evidence/source-commit-after-copy.txt
          git rev-parse HEAD:contract > race-evidence/contract-tree-after-copy.txt
          git status --porcelain --untracked-files=all -- contract > race-evidence/source-status-after-copy.txt
          cmp race-evidence/source-commit.txt race-evidence/source-commit-after-copy.txt
          cmp race-evidence/contract-tree.txt race-evidence/contract-tree-after-copy.txt
          cmp race-evidence/source-status-before.txt race-evidence/source-status-after-copy.txt
          python3 race-evidence/verify-source-export.py race-evidence/source-contract-files.json /ci-source/contract
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
      - name: bind producer temporary root receipt
        run: |
          producer_test_tmp_root="${GOTMPDIR:-${TMPDIR:-}}"
          test "$producer_test_tmp_root" = /ci-tmp
          test -d "$producer_test_tmp_root"
          printf '%s\n' "$producer_test_tmp_root" > race-evidence/producer-temp-root.txt
      - name: inventory pure contract packages
        run: |
          cd /ci-source/contract
          go list -mod=readonly ./... > "$GITHUB_WORKSPACE/race-evidence/pure-packages.list"
          go list -mod=readonly -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d' > "$GITHUB_WORKSPACE/race-evidence/pure-test-packages.list"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: inventory runtime packages and audit the exact module union
        run: |
          cd /ci-source/contract/internal/node
          go list -mod=readonly ./... > "$GITHUB_WORKSPACE/race-evidence/runtime-packages.list"
          go list -mod=readonly -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d' > "$GITHUB_WORKSPACE/race-evidence/runtime-test-packages.list"
          go test -mod=readonly -list '^(Test|Fuzz|Example)' ./store | awk '/^(Test|Fuzz|Example)[[:alnum:]_]*$/' > "$GITHUB_WORKSPACE/race-evidence/all-store-functions.list"
          test -s "$GITHUB_WORKSPACE/race-evidence/all-store-functions.list"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$GITHUB_WORKSPACE/race-evidence/source-commit-after-inventory.txt"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD:contract > "$GITHUB_WORKSPACE/race-evidence/contract-tree-after-inventory.txt"
          git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all -- contract > "$GITHUB_WORKSPACE/race-evidence/source-status-after-inventory.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/source-commit.txt" "$GITHUB_WORKSPACE/race-evidence/source-commit-after-inventory.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/contract-tree.txt" "$GITHUB_WORKSPACE/race-evidence/contract-tree-after-inventory.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/source-status-before.txt" "$GITHUB_WORKSPACE/race-evidence/source-status-after-inventory.txt"
          python3 "$GITHUB_WORKSPACE/race-evidence/verify-source-export.py" "$GITHUB_WORKSPACE/race-evidence/source-contract-files.json" /ci-source/contract
          (cd /ci-source/contract && sha256sum -c "$GITHUB_WORKSPACE/race-evidence/source-module-files.sha256")
          python3 - "$GITHUB_WORKSPACE/race-evidence" "${{ matrix.shard }}" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); shard=int(sys.argv[2])
          puremod="github.com/Telara-Labs/hilo/contract"
          nodemod="github.com/Telara-Labs/hilo/contract/internal/node"
          def lines(name):
              values=(root/name).read_text(encoding="utf-8").splitlines()
              if not values or len(values)!=len(set(values)): raise SystemExit(f"empty or duplicate inventory: {name}")
              return values
          pure=lines("pure-packages.list"); node=lines("runtime-packages.list")
          pure_tests=lines("pure-test-packages.list"); node_tests=lines("runtime-test-packages.list")
          if len(pure)!=len(set(pure)) or len(node)!=len(set(node)): raise SystemExit("duplicate module package inventory")
          if any(x!=puremod and not x.startswith(puremod+"/") for x in pure): raise SystemExit("pure inventory contains a package outside the contract module")
          if any(x==nodemod or x.startswith(nodemod+"/") for x in pure): raise SystemExit("pure inventory includes a package owned by the nested runtime module")
          if any(x!=nodemod and not x.startswith(nodemod+"/") for x in node): raise SystemExit("runtime inventory contains a package outside the nested runtime module")
          if any(x not in set(pure) for x in pure_tests) or any(x not in set(node) for x in node_tests): raise SystemExit("test-package inventory is not a subset of its module inventory")
          if len(pure_tests)!=len(set(pure_tests)) or len(node_tests)!=len(set(node_tests)): raise SystemExit("duplicate test-package inventory")
          if set(pure)&set(node): raise SystemExit("pure/runtime package inventories overlap")
          store=nodemod+"/store"
          if store not in node: raise SystemExit("runtime store package absent from module inventory")
          union=sorted(pure+node)
          (root/"all-packages.list").write_text("".join(x+"\n" for x in union),encoding="utf-8")
          functions=lines("all-store-functions.list")
          if len(functions)!=len(set(functions)): raise SystemExit("duplicate store-function inventory")
          ordinary=[x for x in union if x!=store]
          selected=[x for i,x in enumerate(ordinary) if i%4==shard-1]
          selected_store=[x for i,x in enumerate(functions) if i%4==shard-1]
          if not selected or not selected_store: raise SystemExit("empty race shard or store selector partition")
          (root/"selected-packages.list").write_text("".join(x+"\n" for x in selected),encoding="utf-8")
          (root/"selected-store-functions.list").write_text("".join(x+"\n" for x in selected_store),encoding="utf-8")
          def relative(values,prefix):
              result=[]
              for value in values:
                  if value==prefix: result.append(".")
                  elif value.startswith(prefix+"/"): result.append("./"+value[len(prefix)+1:])
                  else: raise SystemExit("package cannot be mapped to its module root")
              return result
          contract_selected=[x for x in selected if x in set(pure)]
          node_selected=[x for x in selected if x in set(node)]
          if len(contract_selected)+len(node_selected)!=len(selected): raise SystemExit("race package cannot be assigned to exactly one module inventory")
          (root/"selected-contract-packages.list").write_text("".join(x+"\n" for x in relative(contract_selected,puremod)),encoding="utf-8")
          (root/"selected-node-packages.list").write_text("".join(x+"\n" for x in relative(node_selected,nodemod)),encoding="utf-8")
          receipt={"schema":"hilo.race-module-union.v1","source_commit":(root/"source-commit.txt").read_text().strip(),"contract_tree":(root/"contract-tree.txt").read_text().strip(),"source_manifest_sha256":hashlib.sha256((root/"source-contract-files.json").read_bytes()).hexdigest(),"pure_count":len(pure),"runtime_count":len(node),"union_count":len(union),"pure_test_packages":len(pure_tests),"runtime_test_packages":len(node_tests),"store_package":store,"store_functions":len(functions),"shard":shard,"selected_non_store":len(selected),"selected_store_functions":len(selected_store),"union_sha256":hashlib.sha256(("\n".join(union)+"\n").encode()).hexdigest()}
          (root/"module-package-union.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: pure contract packages under race detection
        run: |
          cd /ci-source/contract
          xargs -r go test -mod=readonly -race -p 1 -json -v -count=1 -timeout 25m < "$GITHUB_WORKSPACE/race-evidence/selected-contract-packages.list" > "$GITHUB_WORKSPACE/race-evidence/pure-packages.jsonl" 2>&1 || { cat "$GITHUB_WORKSPACE/race-evidence/pure-packages.jsonl"; exit 1; }
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$GITHUB_WORKSPACE/race-evidence/source-commit-after-tests-pure.txt"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD:contract > "$GITHUB_WORKSPACE/race-evidence/contract-tree-after-tests-pure.txt"
          git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all -- contract > "$GITHUB_WORKSPACE/race-evidence/source-status-after-tests-pure.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/source-commit.txt" "$GITHUB_WORKSPACE/race-evidence/source-commit-after-tests-pure.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/contract-tree.txt" "$GITHUB_WORKSPACE/race-evidence/contract-tree-after-tests-pure.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/source-status-before.txt" "$GITHUB_WORKSPACE/race-evidence/source-status-after-tests-pure.txt"
          python3 "$GITHUB_WORKSPACE/race-evidence/verify-source-export.py" "$GITHUB_WORKSPACE/race-evidence/source-contract-files.json" /ci-source/contract
          (cd /ci-source/contract && sha256sum -c "$GITHUB_WORKSPACE/race-evidence/source-module-files.sha256")
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            contract/go.sum
            contract/internal/node/go.sum
      - name: runtime packages and store functions under race detection
        run: |
          cd /ci-source/contract/internal/node
          go test -mod=readonly -race -p 1 -json -v -count=1 -timeout 25m -run "^($(paste -sd '|' "$GITHUB_WORKSPACE/race-evidence/selected-store-functions.list"))$" ./store > "$GITHUB_WORKSPACE/race-evidence/store.jsonl" 2>&1 || { cat "$GITHUB_WORKSPACE/race-evidence/store.jsonl"; exit 1; }
          xargs -r go test -mod=readonly -race -p 1 -json -v -count=1 -timeout 25m < "$GITHUB_WORKSPACE/race-evidence/selected-node-packages.list" > "$GITHUB_WORKSPACE/race-evidence/runtime-packages.jsonl" 2>&1 || { cat "$GITHUB_WORKSPACE/race-evidence/runtime-packages.jsonl"; exit 1; }
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$GITHUB_WORKSPACE/race-evidence/source-commit-after-tests-runtime.txt"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD:contract > "$GITHUB_WORKSPACE/race-evidence/contract-tree-after-tests-runtime.txt"
          git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all -- contract > "$GITHUB_WORKSPACE/race-evidence/source-status-after-tests-runtime.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/source-commit.txt" "$GITHUB_WORKSPACE/race-evidence/source-commit-after-tests-runtime.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/contract-tree.txt" "$GITHUB_WORKSPACE/race-evidence/contract-tree-after-tests-runtime.txt"
          cmp "$GITHUB_WORKSPACE/race-evidence/source-status-before.txt" "$GITHUB_WORKSPACE/race-evidence/source-status-after-tests-runtime.txt"
          python3 "$GITHUB_WORKSPACE/race-evidence/verify-source-export.py" "$GITHUB_WORKSPACE/race-evidence/source-contract-files.json" /ci-source/contract
          (cd /ci-source/contract && sha256sum -c "$GITHUB_WORKSPACE/race-evidence/source-module-files.sha256")
          cat "$GITHUB_WORKSPACE/race-evidence/pure-packages.jsonl" "$GITHUB_WORKSPACE/race-evidence/runtime-packages.jsonl" > "$GITHUB_WORKSPACE/race-evidence/packages.jsonl"
          cat "$GITHUB_WORKSPACE/race-evidence/packages.jsonl"
      - name: record exact producer artifact inventory
        run: |
          python3 - race-evidence <<'PY'
          import stat,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          if root.is_symlink() or not root.is_dir(): raise SystemExit("producer artifact root is not a real directory")
          names=[]
          for item in root.iterdir():
              mode=item.lstat().st_mode
              if not stat.S_ISREG(mode): raise SystemExit(f"non-regular producer artifact: {item.name}")
              names.append(item.name)
          if len(names)!=len(set(names)) or "producer-artifacts.list" in names: raise SystemExit("duplicate or recursive producer artifact inventory")
          names.append("producer-artifacts.list")
          (root/"producer-artifacts.list").write_text("".join(name+"\n" for name in sorted(names)),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-race-${{ matrix.shard }}
          path: race-evidence
          retention-days: 3

  race-audit:
    needs: [race]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: node-race-1
          path: race-artifacts/1
      - uses: actions/download-artifact@v4
        with:
          name: node-race-2
          path: race-artifacts/2
      - uses: actions/download-artifact@v4
        with:
          name: node-race-3
          path: race-artifacts/3
      - uses: actions/download-artifact@v4
        with:
          name: node-race-4
          path: race-artifacts/4
      - name: audit exact source-bound race union and shard evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          from collections import Counter

          root=Path("race-artifacts")
          shards={i:root/str(i) for i in range(1,5)}
