name: native-macos15
on:
  push:
    branches: [ci-native-macos15]
permissions:
  contents: read
jobs:
  native-driver:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: contract/go.sum
      - name: native custody acceptance driver and actual CLI
        working-directory: contract
        run: |
          test "$(go env GOOS)" = darwin
          test "$(go env GOARCH)" = arm64
          test "$(go env CGO_ENABLED)" = 1
          go test -p 2 -tags e2e -v -count=1 -run '^TestHarness(AuthIsolation|EnvironmentAndArguments|PrecompiledNativeHelper)$' ./e2e/clients
          go test -p 2 -tags e2e -c -o ../clients.test ./e2e/clients
          go build -p 2 -trimpath -o ../telara-memory-darwin-arm64 ./cmd/telara-memory
      - name: compile exact native utility and record source
        run: |
          ./clients.test export-native-helper-source "$PWD/native-helper.c"
          /usr/bin/clang -Wno-deprecated-declarations native-helper.c -framework Security -framework CoreFoundation -o keychain-helper
          shasum -a 256 clients.test telara-memory-darwin-arm64 keychain-helper native-helper.c > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT
          git rev-parse HEAD:contract > CONTRACT_TREE
          git status --porcelain --untracked-files=all -- contract > SOURCE_STATUS
          test ! -s SOURCE_STATUS
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos15-driver
          path: |
            clients.test
            telara-memory-darwin-arm64
            keychain-helper
            native-helper.c
            SHA256SUMS
            SOURCE_COMMIT
            CONTRACT_TREE
            SOURCE_STATUS
          retention-days: 3
